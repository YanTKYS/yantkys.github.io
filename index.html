<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="GitHub Pagesで公開している個人用サイトのランチャーと、GitHubリポジトリのポートフォリオ">
<title>Launcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230017c1'/%3E%3Cpath d='M12 9l9 7-9 7z' fill='%23fff'/%3E%3C/svg%3E">
<script>
/* 初回描画前にテーマを適用してちらつきを防ぐ */
try {
  var p = JSON.parse(localStorage.getItem('launcher.v1') || '{}');
  if (p && (p.theme === 'light' || p.theme === 'dark')) document.documentElement.dataset.theme = p.theme;
} catch (e) {}
</script>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#ffffff, #141414);
  --hover: light-dark(#f4f4f4, #1f1f1f);
  --line: light-dark(#d9d9d9, #3a3a3a);
  --line-strong: light-dark(#8c8c8c, #8a8a8a);
  --text: light-dark(#1a1a1a, #ededed);
  --muted: light-dark(#595959, #b0b0b0);
  --primary: light-dark(#0017c1, #9db4ff);
  --primary-tint: light-dark(#e8f1fe, #1d2747);
  --danger: light-dark(#d60000, #ff9a9a);
  --danger-tint: light-dark(#fdeeee, #3a1b1b);
  --focus-ink: light-dark(#1a1a1a, #ffffff);
  --focus-yellow: #ffd43d;
  --r: 6px;
  --r-s: 4px;
  --header-h: 56px;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.7 "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* フォーカス表示: 黄色 + 濃色の二重線（背景色に依存せず視認できる） */
:focus-visible { outline: 2px solid var(--focus-ink); outline-offset: 2px; box-shadow: 0 0 0 2px var(--focus-yellow); }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; }

/* ヘッダー */
.site-header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 24px; min-height: var(--header-h); }
.brand { font-size: 18px; line-height: 1.4; font-weight: 700; letter-spacing: .02em; }
.tabs { display: flex; align-self: stretch; }
.tabs button {
  height: var(--header-h); padding: 0 16px; border: 0; border-bottom: 3px solid transparent; border-radius: 0;
  background: transparent; color: var(--muted); font-size: 16px; font-weight: 600; line-height: 1.4; white-space: nowrap;
}
.tabs button:hover { background: var(--hover); color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--primary); }
.tabs button:focus-visible { outline-offset: -4px; }

.search { position: relative; margin-left: auto; width: min(360px, 100%); }
.search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; height: 40px; padding: 0 44px 0 36px; font-size: 16px;
  border: 1px solid var(--line-strong); border-radius: var(--r-s);
  background: var(--bg); -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.search kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  min-width: 22px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 3px;
  font: 12px/18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); text-align: center; pointer-events: none;
}
.search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }

.theme { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-s); overflow: hidden; }
.theme button { height: 38px; padding: 0 12px; border: 0; background: transparent; color: var(--muted); font-size: 14px; line-height: 1.4; white-space: nowrap; }
.theme button + button { border-left: 1px solid var(--line-strong); }
.theme button:hover { background: var(--hover); color: var(--text); }
.theme button[aria-pressed="true"] { background: var(--primary-tint); color: var(--primary); font-weight: 700; }
.theme button:focus-visible { outline-offset: -4px; }

/* セクション */
main { padding-block: 20px 8px; }
section { margin-bottom: 28px; }
.section-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
h2 { margin: 0; font-size: 18px; line-height: 1.5; font-weight: 700; }
h2 .count { margin-left: 6px; font-size: 14px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.stamp { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; }
.stamp:empty { display: none; }

/* 絞り込み・並び替え */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.4;
}
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-tint); color: var(--primary); font-weight: 700; }
.chip[aria-pressed="true"]:focus-visible { box-shadow: inset 0 0 0 1px var(--primary), 0 0 0 2px var(--focus-yellow); }
.chip .n { font-size: 13px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .n { color: inherit; }

/* カード */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; }
.card {
  position: relative; display: grid; grid-template-columns: 24px 1fr; column-gap: 12px; align-items: start; align-content: start;
  padding: 10px 14px; min-height: 64px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
}
.card:hover { background: var(--hover); border-color: var(--line-strong); }
.card-link { display: block; font-weight: 700; font-size: 16px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: var(--act-w, 0px); }
.card-link::after { content: ""; position: absolute; inset: -1px; border-radius: var(--r); }
.card:hover .card-link, .card-link:focus-visible { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.card-link:focus-visible { outline: none; box-shadow: none; }
.card-link:focus-visible::after { outline: 2px solid var(--focus-ink); outline-offset: 2px; box-shadow: 0 0 0 2px var(--focus-yellow); }
.tile { grid-row: 1 / span 2; width: 24px; height: 24px; display: grid; place-items: center; color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1; user-select: none; }
.tile .icon { width: 22px; height: 22px; }
.card-desc { text-wrap: pretty; word-break: auto-phrase; color: var(--muted); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-desc:empty { display: none; }
.actions { position: absolute; top: 5px; right: 6px; z-index: 1; display: flex; gap: 0; }
.card:not(.has-repo) { --act-w: 40px; }
.card.has-repo { --act-w: 76px; }
.act { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--r-s); background: transparent; color: var(--muted); }
.act:hover { background: var(--primary-tint); color: var(--primary); }
.act .icon { width: 18px; height: 18px; }
.star[aria-pressed="true"] { color: var(--text); }
.star[aria-pressed="true"] .icon { fill: currentColor; }
.card { scroll-margin-top: calc(var(--header-h) + 16px); }

/* リポジトリ */
.panel[hidden] { display: none; }
.text-link { position: relative; z-index: 1; color: var(--primary); font-size: 14px; line-height: 1.5; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; white-space: nowrap; }
.text-link:hover { text-decoration-thickness: 2px; }
.card.repo, .card.featured { grid-template-columns: 1fr; }
.card.repo { row-gap: 0; }
.repo-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; margin-top: 4px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.card.repo .actions { top: 10px; right: 14px; align-items: center; min-height: 22px; }
.card.repo.has-pages { --act-w: 80px; }
.meta { font-variant-numeric: tabular-nums; }
.feat-grid { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.repo-grid { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.card.featured { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 14px; border-color: var(--line-strong); }
.f-title { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.featured .card-desc { -webkit-line-clamp: 3; line-clamp: 3; }
.card-foot { margin-top: auto; padding-top: 6px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 13px; line-height: 1.6; color: var(--muted); }
.card-foot .card-link { display: inline; padding: 0; font-size: 14px; font-weight: 400; color: var(--primary); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; overflow: visible; }
.card-foot .card-link:focus-visible { text-decoration: underline; }
.links { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 3px; font-size: 12px; line-height: 1; color: var(--muted); }

/* 状態表示 */
.empty { padding: 16px; border: 1px solid var(--line); border-radius: var(--r); color: var(--muted); }
.empty p { margin: 0; }
.empty .btn { margin-top: 12px; }
.btn { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--bg); font-size: 14px; }
.btn:hover { background: var(--hover); }
.notice { margin: 0 0 16px; padding: 12px 16px; border: 1px solid var(--line-strong); border-left-width: 4px; border-radius: var(--r-s); background: var(--hover); font-size: 14px; line-height: 1.6; }
.notice summary { cursor: pointer; }
.notice ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); }
.error { border-color: var(--danger); background: var(--danger-tint); }
.error h2 { font-size: 16px; margin-bottom: 4px; }
.error p { margin: 4px 0; }
.error .btn { margin-top: 8px; }
.error code, .notice code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--text) 8%, transparent); padding: 1px 6px; border-radius: 3px; word-break: break-all; }
footer { margin-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.8; }
footer .wrap { padding-block: 12px 24px; }
footer kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 5px; }

@media (max-width: 860px) {
  .site-header { position: static; }
  .bar { flex-wrap: wrap; gap: 0 16px; padding-top: 10px; }
  .brand { order: 1; }
  .theme { order: 2; margin-left: auto; }
  .tabs { order: 3; flex: 0 0 calc(100% + 32px); margin: 10px -16px 0; padding-inline: 16px; border-top: 1px solid var(--line); }
  .tabs button { flex: 1; height: 44px; }
  .search { order: 4; flex-basis: 100%; width: 100%; margin: 0; padding-block: 10px; }
}
@media (max-width: 640px) {
  .search kbd, footer .kbd-hint { display: none; }
  .chips { margin-left: 0; flex-basis: 100%; }
  .grid, .feat-grid { grid-template-columns: 1fr; }
}
@media (pointer: coarse) {
  .act { width: 40px; height: 40px; }
  .actions { top: 4px; right: 4px; }
  .card.repo .actions { top: 4px; right: 12px; }
  .card:not(.has-repo) { --act-w: 48px; }
  .card.has-repo { --act-w: 92px; }
  .chip { height: 40px; }
  .theme button { height: 40px; }
  .card.repo.has-pages { --act-w: 88px; }
  .text-link, .card-foot .card-link { padding-block: 8px; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <div class="brand">Launcher</div>
    <div class="tabs" role="tablist" aria-label="表示の切り替え">
      <button type="button" role="tab" id="tab-sites" aria-controls="panel-sites" aria-selected="true">Webサイト</button>
      <button type="button" role="tab" id="tab-repos" aria-controls="panel-repos" aria-selected="false" tabindex="-1">リポジトリ</button>
    </div>
    <div class="search" id="search-sites" role="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="サイトを検索" aria-label="サイトを検索（名前・説明）" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div class="search" id="search-repos" role="search" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="rq" type="search" placeholder="リポジトリを検索" aria-label="リポジトリを検索（名前・説明）" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div class="theme" role="group" aria-label="テーマ">
      <button type="button" data-theme-set="system" aria-pressed="false" title="システム設定に合わせる">システム</button>
      <button type="button" data-theme-set="light" aria-pressed="false" title="ライト">ライト</button>
      <button type="button" data-theme-set="dark" aria-pressed="false" title="ダーク">ダーク</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
<noscript><p class="notice error">このページの表示にはJavaScriptが必要です。</p></noscript>
<div class="panel" id="panel-sites" role="tabpanel" aria-labelledby="tab-sites">
  <div id="notices"></div>
  <section id="fav-section" aria-labelledby="fav-title" hidden>
    <div class="section-head">
      <h2 id="fav-title">お気に入り<span class="count" id="fav-count"></span></h2>
    </div>
    <div class="grid" id="fav-grid"></div>
    <div id="fav-empty"></div>
  </section>
  <section id="all-section" aria-labelledby="all-title" hidden>
    <div class="section-head">
      <h2 id="all-title"><span id="all-label">すべてのサイト</span> <span class="count" id="all-count" aria-live="polite"></span></h2>
      <div class="chips" id="chips" role="group" aria-label="カテゴリで絞り込み"></div>
    </div>
    <div class="grid" id="all-grid"></div>
    <div id="all-empty"></div>
  </section>
  <p id="loading" class="empty" role="status">読み込み中…</p>
</div>

<div class="panel" id="panel-repos" role="tabpanel" aria-labelledby="tab-repos" hidden>
  <div id="repo-notices"></div>
  <section id="feat-section" aria-labelledby="feat-title" hidden>
    <div class="section-head">
      <h2 id="feat-title">代表作品<span class="count" id="feat-count"></span></h2>
    </div>
    <div class="grid feat-grid" id="feat-grid"></div>
  </section>
  <section id="repo-section" aria-labelledby="repo-title" hidden>
    <div class="section-head">
      <h2 id="repo-title">全リポジトリ<span class="count" id="repo-count" aria-live="polite"></span></h2>
      <span class="stamp" id="repo-stamp"></span>
      <div class="chips" id="sort-chips" role="group" aria-label="並び順">
        <button type="button" class="chip" data-sort="updated" aria-pressed="true">更新が新しい順</button>
        <button type="button" class="chip" data-sort="name" aria-pressed="false">名前順</button>
      </div>
    </div>
    <div class="grid repo-grid" id="repo-grid"></div>
    <div id="repo-empty"></div>
  </section>
  <p id="repo-loading" class="empty" role="status">読み込み中…</p>
</div>
</main>

<footer><div class="wrap">
  <span class="kbd-hint" id="hint-sites"><kbd>/</kbd> 検索 ・ <kbd>Enter</kbd> 先頭を開く ・ <kbd>↓</kbd><kbd>↑</kbd><kbd>←</kbd><kbd>→</kbd> カード移動 ・ <kbd>Esc</kbd> 検索を解除 ・ タブ上で <kbd>←</kbd><kbd>→</kbd> 切替</span>
  <span class="kbd-hint" id="hint-repos" hidden><kbd>/</kbd> 検索 ・ <kbd>Enter</kbd> 先頭をGitHubで開く ・ <kbd>↓</kbd><kbd>↑</kbd><kbd>←</kbd><kbd>→</kbd> カード移動 ・ <kbd>Esc</kbd> 検索を解除 ・ タブ上で <kbd>←</kbd><kbd>→</kbd> 切替</span>
</div></footer>

<script>
(() => {
'use strict';

const STORE_KEY = 'launcher.v1';
const DATA_URL = 'sites.json';
const DEFAULT_CATEGORY = 'その他';
const SVG_NS = 'http://www.w3.org/2000/svg';

/* 外部サービスに依存しない組み込みアイコン（sites.json の icon に名前を指定） */
const ICONS = {
  kanban:   '<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>',

};
const GLYPH_STAR = '<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/>';
const GLYPH_GITHUB = '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>';
const REPO_DATA_URL = 'repositories.json';
const FEATURED_URL = 'featured.json';

const $ = (id) => document.getElementById(id);
const els = {
  q: $('q'), notices: $('notices'), loading: $('loading'),
  favSection: $('fav-section'), favGrid: $('fav-grid'), favEmpty: $('fav-empty'), favCount: $('fav-count'),
  allSection: $('all-section'), allGrid: $('all-grid'), allEmpty: $('all-empty'), allCount: $('all-count'),
  allLabel: $('all-label'), chips: $('chips'),
  rq: $('rq'), repoNotices: $('repo-notices'), repoLoading: $('repo-loading'),
  featSection: $('feat-section'), featGrid: $('feat-grid'), featCount: $('feat-count'),
  repoSection: $('repo-section'), repoGrid: $('repo-grid'), repoEmpty: $('repo-empty'),
  repoCount: $('repo-count'), repoStamp: $('repo-stamp'), sortChips: $('sort-chips')
};

const state = { sites: [], categories: [], favs: new Set(), terms: [], category: null, chipEls: new Map() };
const rstate = { status: 'idle', repos: [], cards: new Map(), terms: [], sort: 'updated' };
let sitesReady = Promise.resolve();   // リポジトリ画面が sites.json（Pages リンク・説明の補完）を待つために使う

/* ---------- ユーティリティ ---------- */

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null) el.append(c);   // 文字列は textNode として追加される（HTML注入なし）
  return el;
}

function svg(inner, cls = 'icon') {
  const s = document.createElementNS(SVG_NS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('class', cls);
  s.setAttribute('aria-hidden', 'true');
  s.innerHTML = inner;   // 組み込みの固定文字列のみ（サイト定義の値は渡さない）
  return s;
}

const norm = (s) => String(s).normalize('NFKC').toLowerCase();

function safeUrl(value, { githubOnly = false } = {}) {
  if (typeof value !== 'string') return null;
  let u;
  try { u = new URL(value.trim()); } catch { return null; }
  if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
  if (u.username || u.password) return null;
  if (githubOnly && !/^(www\.)?github\.com$/i.test(u.hostname)) return null;
  return u.href;
}

/* ---------- 個人設定 (localStorage) ---------- */

function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return p && typeof p === 'object' && !Array.isArray(p) ? p : {};
  } catch { return {}; }
}

let saveWarned = false;
function savePrefs(patch) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ ...loadPrefs(), ...patch }));
  } catch {
    if (!saveWarned) {
      saveWarned = true;
      addNotice('ブラウザの設定により、お気に入りやテーマを保存できません。この画面を閉じると元に戻ります。');
    }
  }
}

/* ---------- テーマ ---------- */

function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') root.dataset.theme = mode; else delete root.dataset.theme;
  document.querySelectorAll('[data-theme-set]').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.themeSet === (mode === 'light' || mode === 'dark' ? mode : 'system'))));
}

function initTheme() {
  applyTheme(loadPrefs().theme);
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => {
    const mode = b.dataset.themeSet;
    applyTheme(mode);
    savePrefs({ theme: mode === 'system' ? null : mode });
  }));
}

/* ---------- データ読み込み・検証 ---------- */

function addNotice(text, items) {
  const box = items && items.length
    ? h('details', { class: 'notice' }, h('summary', {}, text), h('ul', {}, items.map((i) => h('li', {}, i))))
    : h('p', { class: 'notice' }, text);
  els.notices.append(box);
}

function showError(title, detail, hint) {
  els.loading.hidden = true;
  els.favSection.hidden = true;
  els.allSection.hidden = true;
  els.notices.replaceChildren(h('div', { class: 'notice error', role: 'alert' },
    h('h2', {}, title),
    detail ? h('p', {}, h('code', {}, detail)) : null,
    hint ? h('p', {}, hint) : null));
}

function validate(data) {
  const warnings = [];
  if (!data || typeof data !== 'object' || !Array.isArray(data.sites)) {
    throw new Error('トップレベルが { "sites": [ ... ] } の形式になっていません。');
  }
  const seen = new Set();
  const sites = [];
  data.sites.forEach((raw, i) => {
    const label = `sites[${i}]` + (raw && typeof raw.id === 'string' ? ` (${raw.id})` : '');
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) { warnings.push(`${label}: オブジェクトではありません`); return; }
    const str = (v) => (typeof v === 'string' ? v.trim() : '');
    const id = str(raw.id), name = str(raw.name);
    if (!id) { warnings.push(`${label}: id がありません`); return; }
    if (seen.has(id)) { warnings.push(`${label}: id が重複しています`); return; }
    if (!name) { warnings.push(`${label}: name がありません`); return; }
    const url = safeUrl(raw.url);
    if (!url) { warnings.push(`${label}: url が正しい http(s) URL ではありません`); return; }
    let repo = null;
    if (raw.repo != null && raw.repo !== '') {
      repo = safeUrl(raw.repo, { githubOnly: true });
      if (!repo) warnings.push(`${label}: repo が GitHub の URL ではないため、リンクを表示しません`);
    }
    seen.add(id);
    sites.push({
      id, name, url, repo,
      description: str(raw.description),
      category: str(raw.category) || DEFAULT_CATEGORY,
      icon: str(raw.icon),
      favorite: raw.favorite === true,
      hay: norm(name + ' ' + str(raw.description))
    });
  });
  if (!sites.length) throw new Error('表示できるサイト定義がありません。' + (warnings.length ? ' ' + warnings.join(' / ') : ''));
  return { sites, warnings };
}

async function load() {
  let res;
  try {
    res = await fetch(DATA_URL, { cache: 'no-cache' });
  } catch (e) {
    const local = location.protocol === 'file:';
    return showError('sites.json を取得できませんでした', String(e && e.message || e),
      local ? 'ファイルを直接開くと読み込めません。ローカルサーバー（例: python3 -m http.server）経由で開いてください。'
            : 'ネットワーク接続、または公開状態を確認してください。');
  }
  if (!res.ok) {
    return showError(`sites.json を取得できませんでした（HTTP ${res.status}）`, `${new URL(DATA_URL, location.href).href}`,
      res.status === 404 ? 'index.html と同じ場所に sites.json が公開されているか確認してください。' : 'しばらくしてから再読み込みしてください。');
  }
  let data;
  try {
    data = await res.json();
  } catch (e) {
    return showError('sites.json の JSON 構文が正しくありません', String(e && e.message || e),
      'カンマ・引用符・括弧の過不足を確認してください。');
  }
  let result;
  try {
    result = validate(data);
  } catch (e) {
    return showError('sites.json の内容が正しくありません', String(e.message), '仕様は README.md を参照してください。');
  }
  start(result.sites, result.warnings);
}

/* ---------- 描画 ---------- */

function start(sites, warnings) {
  state.sites = sites;
  state.categories = [...new Set(sites.map((s) => s.category))];
  const saved = loadPrefs().favorites;
  const initial = Array.isArray(saved) ? saved.filter((x) => typeof x === 'string') : sites.filter((s) => s.favorite).map((s) => s.id);
  state.favs = new Set(initial);
  if (warnings.length) addNotice(`${warnings.length}件のサイト定義に問題があります（該当部分を読み飛ばしました）`, warnings);
  buildChips();
  els.loading.hidden = true;
  els.favSection.hidden = false;
  els.allSection.hidden = false;
  render();
  if (els.q.value) onQuery();   // ブラウザが復元した入力値を反映
}

function buildChips() {
  els.chips.replaceChildren();
  state.chipEls.clear();
  const make = (value, label) => {
    const n = h('span', { class: 'n' });
    const b = h('button', { type: 'button', class: 'chip', 'aria-pressed': 'false' }, label, n);
    b.addEventListener('click', () => { state.category = value; render(); });
    state.chipEls.set(value, { b, n });
    els.chips.append(b);
  };
  make(null, 'すべて');
  state.categories.forEach((c) => make(c, c));
}

function matches(site) {
  return state.terms.every((t) => site.hay.includes(t));
}

function card(site, section) {
  const fav = state.favs.has(site.id);
  const tile = h('span', { class: 'tile' });
  if (ICONS[site.icon]) tile.append(svg(ICONS[site.icon]));
  else tile.append(Array.from(site.icon || site.name).slice(0, 2).join(''));

  const link = h('a', { class: 'card-link', href: site.url, target: '_blank', rel: 'noopener noreferrer', title: site.name }, site.name);

  const star = h('button', { type: 'button', class: 'act star', 'aria-pressed': String(fav),
    'aria-label': `${site.name}をお気に入り`, title: fav ? 'お気に入りを解除' : 'お気に入りに追加' }, svg(GLYPH_STAR));
  star.addEventListener('click', () => toggleFav(site.id, section));

  const actions = h('div', { class: 'actions' });
  if (site.repo) {
    actions.append(h('a', { class: 'act', href: site.repo, target: '_blank', rel: 'noopener noreferrer',
      'aria-label': `${site.name}のGitHubリポジトリを開く`, title: 'GitHubリポジトリ' }, svg(GLYPH_GITHUB)));
  }
  actions.append(star);

  return h('article', { class: 'card' + (site.repo ? ' has-repo' : ''), 'data-id': site.id, 'data-section': section },
    tile, link, h('span', { class: 'card-desc', title: site.description }, site.description), actions);
}

function emptyBox(msg, button) {
  const box = h('div', { class: 'empty' }, h('p', {}, msg));
  if (button) {
    const b = h('button', { type: 'button', class: 'btn' }, button.label);
    b.addEventListener('click', button.onClick);
    box.append(b);
  }
  return box;
}

function render() {
  const searching = state.terms.length > 0;
  const query = els.q.value.trim();

  /* お気に入り */
  els.favSection.hidden = searching;
  if (!searching) {
    const favs = state.sites.filter((s) => state.favs.has(s.id));
    els.favGrid.replaceChildren(...favs.map((s) => card(s, 'fav')));
    els.favCount.textContent = favs.length ? `${favs.length}` : '';
    els.favEmpty.replaceChildren(favs.length ? '' : emptyBox('お気に入りはまだありません。カード右上の ☆ から登録できます。'));
  }

  /* カテゴリ（件数は検索語に連動） */
  const base = state.sites.filter(matches);
  for (const [value, { b, n }] of state.chipEls) {
    const c = value == null ? base.length : base.filter((s) => s.category === value).length;
    n.textContent = c;
    b.setAttribute('aria-pressed', String(state.category === value));
  }

  /* 全サイト／検索結果 */
  const list = base.filter((s) => state.category == null || s.category === state.category);
  els.allLabel.textContent = searching ? '検索結果' : (state.category ?? 'すべてのサイト');
  els.allCount.textContent = `${list.length}件`;
  els.allGrid.replaceChildren(...list.map((s) => card(s, 'all')));
  if (list.length) {
    els.allEmpty.replaceChildren();
  } else if (searching && state.category != null && base.length) {
    els.allEmpty.replaceChildren(emptyBox(`カテゴリ「${state.category}」に「${query}」に一致するサイトはありません（他のカテゴリに${base.length}件あります）。`,
      { label: 'すべてのカテゴリで表示', onClick: () => { state.category = null; render(); } }));
  } else if (searching) {
    els.allEmpty.replaceChildren(emptyBox(`「${query}」に一致するサイトはありません。サイト名や説明文の別のキーワードをお試しください。`,
      { label: '検索を解除', onClick: () => { clearQuery(); els.q.focus(); } }));
  } else {
    els.allEmpty.replaceChildren(emptyBox('このカテゴリに表示できるサイトはありません。'));
  }
}

function toggleFav(id, section) {
  if (state.favs.has(id)) state.favs.delete(id); else state.favs.add(id);
  savePrefs({ favorites: [...state.favs] });
  render();
  const pick = (sec) => document.querySelector(`.card[data-section="${sec}"][data-id="${CSS.escape(id)}"] .star`);
  (pick(section) || pick('all') || document.querySelector('.card .star') || els.q).focus();
}

/* ---------- 検索・キーボード ---------- */

function onQuery() {
  state.terms = norm(els.q.value).split(/\s+/).filter(Boolean);
  render();
}

function clearQuery() {
  els.q.value = '';
  onQuery();
}

function openFirst() {
  const first = els.allGrid.querySelector('.card-link');
  if (first) window.open(first.href, '_blank', 'noopener,noreferrer');
}

function neighbour(from, key) {
  const links = [...document.querySelectorAll('.card-link')].filter((el) => el.getClientRects().length);   // 非表示セクションのカードは除外
  const r = from.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of links) {
    if (el === from) continue;
    const b = el.getBoundingClientRect();
    const dx = b.left + b.width / 2 - cx, dy = b.top + b.height / 2 - cy;
    let ok, score;
    if (key === 'ArrowRight')     { ok = dx > 4 && Math.abs(dy) < r.height / 2; score = dx; }
    else if (key === 'ArrowLeft') { ok = dx < -4 && Math.abs(dy) < r.height / 2; score = -dx; }
    else if (key === 'ArrowDown') { ok = dy > r.height / 2; score = dy * 4 + Math.abs(dx); }
    else                          { ok = dy < -r.height / 2; score = -dy * 4 + Math.abs(dx); }
    if (ok && score < bestScore) { best = el; bestScore = score; }
  }
  if (!best && (key === 'ArrowRight' || key === 'ArrowLeft')) {
    best = links[links.indexOf(from) + (key === 'ArrowRight' ? 1 : -1)] || null;
  }
  return best;
}

const activeInput = () => (activeTab === 'repos' ? els.rq : els.q);

function clearActiveQuery() {
  if (activeTab === 'repos') clearRepoQuery(); else clearQuery();
}

function initKeys() {
  els.q.addEventListener('input', onQuery);
  els.rq.addEventListener('input', onRepoQuery);
  els.rq.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      const first = els.repoGrid.querySelector('.card-link');
      if (first) window.open(first.href, '_blank', 'noopener,noreferrer');
    } else if (e.key === 'Escape') { if (els.rq.value) clearRepoQuery(); else els.rq.blur(); }
    else if (e.key === 'ArrowDown') {
      // 検索中は検索結果（全リポジトリ）の先頭へ、通常時は画面順で先頭（代表作品）へ
      const first = (rstate.terms.length ? els.repoGrid : $('panel-repos')).querySelector('.card-link');
      if (first) { e.preventDefault(); first.focus(); }
    }
  });
  els.q.addEventListener('keydown', (e) => {
    if (e.isComposing) return;   // IME変換中のEnter/Escは対象外
    if (e.key === 'Enter') { e.preventDefault(); openFirst(); }
    else if (e.key === 'Escape') { if (els.q.value) clearQuery(); else els.q.blur(); }
    else if (e.key === 'ArrowDown') {
      const first = (state.terms.length ? els.allGrid : els.favGrid.firstElementChild ? els.favGrid : els.allGrid).querySelector('.card-link');
      if (first) { e.preventDefault(); first.focus(); }
    }
  });

  document.addEventListener('keydown', (e) => {
    const t = e.target;
    const typing = t instanceof HTMLElement && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
    if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      const input = activeInput();
      input.focus(); input.select();
      return;
    }
    if (e.key === 'Escape' && !typing && activeInput().value) { clearActiveQuery(); return; }
    if (t instanceof HTMLElement && t.classList.contains('card-link') && e.key.startsWith('Arrow') && !e.altKey && !e.ctrlKey && !e.metaKey) {
      const next = neighbour(t, e.key);
      if (next) { e.preventDefault(); next.focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeInput().focus(); }
    }
  });
}

/* ---------- タブ ---------- */

const TABS = ['sites', 'repos'];
const tabEls = Object.fromEntries(TABS.map((k) => [k, {
  tab: $('tab-' + k), panel: $('panel-' + k), search: $('search-' + k), hint: $('hint-' + k)
}]));
const scrollPos = {};
let activeTab = 'sites';

function selectTab(name, { focus = false } = {}) {
  if (!TABS.includes(name)) return;
  if (name !== activeTab) scrollPos[activeTab] = window.scrollY;
  const changed = name !== activeTab;
  activeTab = name;
  for (const [k, t] of Object.entries(tabEls)) {
    const on = k === name;
    t.tab.setAttribute('aria-selected', String(on));
    t.tab.tabIndex = on ? 0 : -1;
    t.panel.hidden = !on;
    t.search.hidden = !on;
    t.hint.hidden = !on;
  }
  if (focus) tabEls[name].tab.focus();
  if (name === 'repos') loadRepos();
  const hash = name === 'repos' ? '#repos' : '';
  if (location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);
  if (changed) window.scrollTo(0, scrollPos[name] || 0);
}

function initTabs() {
  for (const k of TABS) {
    tabEls[k].tab.addEventListener('click', () => selectTab(k));
    tabEls[k].tab.addEventListener('keydown', (e) => {
      const i = TABS.indexOf(k);
      let to = null;
      if (e.key === 'ArrowRight') to = TABS[(i + 1) % TABS.length];
      else if (e.key === 'ArrowLeft') to = TABS[(i + TABS.length - 1) % TABS.length];
      else if (e.key === 'Home') to = TABS[0];
      else if (e.key === 'End') to = TABS[TABS.length - 1];
      if (to) { e.preventDefault(); selectTab(to, { focus: true }); }
    });
  }
  window.addEventListener('hashchange', () => selectTab(location.hash === '#repos' ? 'repos' : 'sites'));
  if (location.hash === '#repos') selectTab('repos');   // 通常の初期表示は「Webサイト」
}

/* ---------- リポジトリ ---------- */

const jstDate = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' });
const jstDateTime = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });

function showRepoError(title, detail, hint, retry) {
  els.repoLoading.hidden = true;
  els.featSection.hidden = true;
  els.repoSection.hidden = true;
  const box = h('div', { class: 'notice error', role: 'alert' },
    h('h2', {}, title),
    detail ? h('p', {}, h('code', {}, detail)) : null,
    hint ? h('p', {}, hint) : null);
  if (retry) {
    const b = h('button', { type: 'button', class: 'btn' }, '再読み込み');
    b.addEventListener('click', loadRepos);
    box.append(b);
  }
  els.repoNotices.replaceChildren(box);
}

async function fetchJson(url, { optional = false } = {}) {
  let res;
  try { res = await fetch(url, { cache: 'no-cache' }); }
  catch (e) {
    const err = new Error(`${url} を取得できませんでした`);
    err.detail = String(e && e.message || e);
    err.hint = location.protocol === 'file:'
      ? 'ファイルを直接開くと読み込めません。ローカルサーバー（例: python3 -m http.server）経由で開いてください。'
      : 'ネットワーク接続、または公開状態を確認してください。';
    throw err;
  }
  if (!res.ok) {
    if (optional && res.status === 404) return null;
    const err = new Error(`${url} を取得できませんでした（HTTP ${res.status}）`);
    err.detail = new URL(url, location.href).href;
    err.hint = res.status === 404 && url === REPO_DATA_URL
      ? 'repositories.json は GitHub Actions が生成します。公開後に Actions の実行（Deploy site）が成功しているか確認してください。ローカルでは node scripts/fetch-repos.mjs で生成できます。'
      : 'しばらくしてから再読み込みしてください。';
    throw err;
  }
  try { return await res.json(); }
  catch (e) {
    const err = new Error(`${url} の JSON 構文が正しくありません`);
    err.detail = String(e && e.message || e);
    err.hint = 'ファイルの内容を確認してください。';
    throw err;
  }
}

/* sites.json の repo URL から「リポジトリ名 → サイト定義」を引けるようにする（Pages リンク・説明の補完に使う） */
function siteIndex(owner) {
  const map = new Map();
  for (const s of state.sites) {
    if (!s.repo) continue;
    const [o, n] = new URL(s.repo).pathname.split('/').filter(Boolean);
    if (o && n && o.toLowerCase() === String(owner).toLowerCase()) map.set(n.toLowerCase().replace(/\.git$/, ''), s);
  }
  return map;
}

function validateRepos(data) {
  if (!data || typeof data !== 'object' || !Array.isArray(data.repositories)) {
    throw Object.assign(new Error('repositories.json の形式が正しくありません'), { hint: '{ "repositories": [ ... ] } の形式になっていません。' });
  }
  const byName = siteIndex(data.owner || 'YanTKYS');
  const str = (v) => (typeof v === 'string' ? v.trim() : '');
  const repos = [];
  for (const r of data.repositories) {
    const name = r && str(r.name), url = r && safeUrl(r.html_url, { githubOnly: true });
    if (!name || !url) continue;
    const site = byName.get(name.toLowerCase());
    const time = Date.parse(r.pushed_at);
    const desc = str(r.description) || (site ? site.description : '');
    repos.push({
      name, key: name.toLowerCase(), url, description: desc, language: str(r.language),
      pushedAt: str(r.pushed_at), time: Number.isNaN(time) ? null : time,
      fork: r.fork === true, archived: r.archived === true,
      // sites.json に登録済みの公開URLを優先し、なければ Actions が検出した GitHub Pages を使う
      pages: (site && site.url) || safeUrl(r.pages_url) || null,
      hay: norm(name + ' ' + desc)
    });
  }
  if (!repos.length) throw Object.assign(new Error('repositories.json に表示できるリポジトリがありません'), { hint: 'GitHub Actions の実行結果を確認してください。' });
  return { repos, generatedAt: str(data.generated_at) };
}

function pushedLabel(repo) {
  if (repo.time == null) return h('span', { class: 'meta' }, 'Push履歴なし');
  const d = new Date(repo.time);
  return h('span', { class: 'meta' }, '最終Push ',
    h('time', { datetime: repo.pushedAt, title: `${jstDateTime.format(d)} JST` }, jstDate.format(d)));
}

function langLabel(repo) {
  return repo.language ? h('span', { class: 'meta' }, repo.language) : null;
}

function badges(repo) {
  return [
    repo.fork ? h('span', { class: 'badge' }, 'Fork') : null,
    repo.archived ? h('span', { class: 'badge archived' }, 'Archived') : null
  ];
}

function pagesLink(repo) {
  return h('a', { class: 'text-link', href: repo.pages, target: '_blank', rel: 'noopener noreferrer',
    'aria-label': `${repo.name}の公開サイトを開く`, title: '公開サイト（GitHub Pages）' }, '公開サイト');
}

function featuredCard(repo) {
  const links = h('div', { class: 'links' },
    h('a', { class: 'card-link', href: repo.url, target: '_blank', rel: 'noopener noreferrer',
      'aria-label': `${repo.name}をGitHubで開く`, title: 'GitHubで開く' }, 'GitHub'));
  if (repo.pages) links.append(pagesLink(repo));
  return h('article', { class: 'card featured', 'data-name': repo.name },
    h('h3', { class: 'f-title', title: repo.name }, repo.name),
    h('span', { class: 'card-desc', title: repo.description }, repo.description),
    h('div', { class: 'card-foot' }, badges(repo), langLabel(repo), pushedLabel(repo), links));
}

function repoCard(repo) {
  return h('article', { class: 'card repo' + (repo.pages ? ' has-pages' : ''), 'data-name': repo.name },
    h('a', { class: 'card-link', href: repo.url, target: '_blank', rel: 'noopener noreferrer', title: repo.name }, repo.name),
    h('span', { class: 'card-desc', title: repo.description }, repo.description),
    h('div', { class: 'repo-meta' }, badges(repo), langLabel(repo), pushedLabel(repo)),
    repo.pages ? h('div', { class: 'actions' }, pagesLink(repo)) : null);
}

/* 更新が新しい順（pushed_at の降順。同時刻は名前順、日時なしは末尾）／名前順 */
function sortRepos(list, mode) {
  const byName = (a, b) => (a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
  const sorted = [...list];
  if (mode === 'name') return sorted.sort(byName);
  return sorted.sort((a, b) => {
    if (a.time == null || b.time == null) return a.time == null && b.time == null ? byName(a, b) : a.time == null ? 1 : -1;
    return b.time - a.time || byName(a, b);
  });
}

function renderRepos() {
  const searching = rstate.terms.length > 0;
  const query = els.rq.value.trim();
  const list = sortRepos(rstate.repos.filter((r) => rstate.terms.every((t) => r.hay.includes(t))), rstate.sort);
  els.repoCount.textContent = searching ? `${list.length} / ${rstate.repos.length}件` : `${list.length}件`;
  els.repoGrid.replaceChildren(...list.map((r) => rstate.cards.get(r.key)));
  els.sortChips.querySelectorAll('[data-sort]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sort === rstate.sort)));
  if (list.length) els.repoEmpty.replaceChildren();
  else els.repoEmpty.replaceChildren(emptyBox(`「${query}」に一致するリポジトリはありません。名前や説明文の別のキーワードをお試しください。`,
    { label: '検索を解除', onClick: () => { clearRepoQuery(); els.rq.focus(); } }));
}

function onRepoQuery() {
  rstate.terms = norm(els.rq.value).split(/\s+/).filter(Boolean);
  renderRepos();
}

function clearRepoQuery() {
  els.rq.value = '';
  onRepoQuery();
}

async function loadRepos() {
  if (rstate.status === 'loading' || rstate.status === 'ready') return;
  rstate.status = 'loading';
  els.repoNotices.replaceChildren();
  els.repoLoading.hidden = false;
  let repoData, featData, featError = null;
  try {
    [repoData, featData] = await Promise.all([
      fetchJson(REPO_DATA_URL),
      fetchJson(FEATURED_URL, { optional: true }).catch((e) => { featError = e; return null; }),
      sitesReady
    ]);
  } catch (e) {
    rstate.status = 'idle';
    return showRepoError(e.message, e.detail, e.hint, true);
  }
  let parsed;
  try { parsed = validateRepos(repoData); }
  catch (e) { rstate.status = 'idle'; return showRepoError(e.message, e.detail, e.hint, true); }

  rstate.repos = parsed.repos;
  rstate.cards = new Map(parsed.repos.map((r) => [r.key, repoCard(r)]));

  /* 代表作品: featured.json の並び順どおり。説明・リンクは取得済みのリポジトリ情報を使う */
  const notes = [];
  if (featError) notes.push(['代表作品の設定（featured.json）を読み込めませんでした', [featError.message + (featError.detail ? `: ${featError.detail}` : '')]]);
  const names = featData && Array.isArray(featData.featured) ? featData.featured.filter((n) => typeof n === 'string' && n.trim()) : [];
  if (featData && !Array.isArray(featData.featured)) notes.push(['featured.json の形式が正しくありません', ['{ "featured": ["リポジトリ名", ...] } の形式にしてください。']]);
  const byKey = new Map(parsed.repos.map((r) => [r.key, r]));
  const seen = new Set(), picked = [], missing = [];
  for (const n of names) {
    const r = byKey.get(n.trim().toLowerCase());
    if (!r) missing.push(n); else if (!seen.has(r.key)) { seen.add(r.key); picked.push(r); }
  }
  if (missing.length) notes.push([`代表作品に指定された${missing.length}件は公開リポジトリに見つかりません（表示を省略）`, missing]);
  els.repoNotices.replaceChildren(...notes.map(([t, items]) => h('details', { class: 'notice' }, h('summary', {}, t), h('ul', {}, items.map((i) => h('li', {}, i))))));
  els.featGrid.replaceChildren(...picked.map(featuredCard));
  els.featCount.textContent = picked.length ? `${picked.length}` : '';
  els.featSection.hidden = !picked.length;

  if (parsed.generatedAt && !Number.isNaN(Date.parse(parsed.generatedAt))) {
    els.repoStamp.textContent = `データ取得 ${jstDateTime.format(new Date(parsed.generatedAt))} JST`;
  }
  els.sortChips.querySelectorAll('[data-sort]').forEach((b) => b.addEventListener('click', () => { rstate.sort = b.dataset.sort; renderRepos(); }));
  els.repoLoading.hidden = true;
  els.repoSection.hidden = false;
  rstate.status = 'ready';
  renderRepos();
  if (els.rq.value) onRepoQuery();   // ブラウザが復元した入力値を反映
}

initTheme();
initKeys();
sitesReady = load();
initTabs();
})();
</script>
</body>
</html>
